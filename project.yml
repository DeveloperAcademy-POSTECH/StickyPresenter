name: StickyPresenter
options:
  bundleIdPrefix: com.gaebalja-ri
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"

targets:
  StickyPresenter:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: StickyPresenter
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gaebalja-ri.StickyPresenter
        SWIFT_VERSION: "5.9"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        INFOPLIST_FILE: StickyPresenter/Info.plist
        CODE_SIGN_ENTITLEMENTS: StickyPresenter/StickyPresenter.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          COPY_PHASE_STRIP: NO
