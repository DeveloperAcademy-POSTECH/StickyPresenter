name: StickyPresenterRemote
options:
  bundleIdPrefix: com.leeo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  StickyPresenterRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Mac 앱과 **같은 파일**을 참조한다. 복사본을 두면 한쪽만 고쳤을 때
      # 디코딩이 조용히 깨지므로 반드시 원본을 공유할 것.
      - path: ../Shared/RemoteProtocol.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leeo.StickyPresenter.Remote
        # 서명 설정은 반드시 여기에 둘 것.
        # Xcode 에서 Signing & Capabilities 로 지정하면 생성된 pbxproj 에만 남아
        # 다음 `xcodegen generate` 때 사라진다.
        DEVELOPMENT_TEAM: QGAQ3AY3R3
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Mac 앱과 같은 버전으로 맞춘다 — 둘이 한 릴리즈로 함께 움직이고,
        # 리모컨 기능은 양쪽이 같은 버전이어야 맞물린다 (위치 옮기기가 그 예).
        # 빌드 번호는 이 앱 안에서만 단조 증가하면 된다 (1.0 이 2 였으므로 3).
        MARKETING_VERSION: "1.0.7"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        # iPhone 전용(1). iPad(2)까지 넣으면 App Store 가 멀티태스킹을 위해
        # 네 방향을 모두 지원하라고 요구해 업로드가 거절된다.
        #   "you need to include all of the Portrait, PortraitUpsideDown,
        #    LandscapeLeft, LandscapeRight orientations to support iPad multitasking"
        # 이 앱은 한 손으로 쓰는 리모컨이라 세로 고정이 맞고, 화면 문구도 전부
        # iPhone 기준이다. iPad 에서는 호환 모드로 그대로 설치·실행된다.
        # iPad 를 정식 지원하려면 "1,2" 로 되돌리고 네 방향을 모두 열어야 한다.
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Remote Controller
        # 값을 그대로 적으면 plist 쪽이 이겨서 위의 MARKETING_VERSION /
        # CURRENT_PROJECT_VERSION 이 무시된다. 버전은 한 곳에서만 관리한다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices:
          - _sp-timer._tcp
          - _sp-timer._udp
        NSLocalNetworkUsageDescription: 같은 네트워크에 있는 Mac의 StickyPresenter를 찾아 타이머를 조작합니다.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
